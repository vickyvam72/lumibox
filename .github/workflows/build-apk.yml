name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust (target Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build library Rust (.so) untuk Android
        working-directory: bridge
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Pakai NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a --platform 26 \
            -o ../android/app/src/main/jniLibs build --release
          ls -R ../android/app/src/main/jniLibs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/MovieBox.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-APK
          path: dist/MovieBox.apk

      - name: Publish ke GitHub Release (kalau push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MovieBox.apk
