name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust (target Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build library Rust (.so) untuk Android
        working-directory: bridge
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Pakai NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a --platform 26 \
            -o ../android/app/src/main/jniLibs build --release
          ls -R ../android/app/src/main/jniLibs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Laporkan error build
        if: failure()
        working-directory: android
        run: |
          if [ -f build.log ]; then
            grep -E "^e: |error:|What went wrong|Unresolved|Type mismatch" -A2 build.log | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/LumiBox.apk

      - name: Simpan APK ke branch "apk"
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p apkbranch && cp dist/LumiBox.apk apkbranch/
          cd apkbranch
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b apk
          git add LumiBox.apk
          git commit -q -m "LumiBox.apk build ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: LumiBox-APK
          path: dist/LumiBox.apk

      - name: Publish ke GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LumiBox.apk

      - name: Publish ke GitHub Release (setiap push ke main)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lumi Box build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            APK otomatis dari commit ${{ github.sha }}.
            Download **LumiBox.apk** di bawah, lalu install di HP Android (izinkan "sumber tidak dikenal").
          files: dist/LumiBox.apk
