[package]
name = "moviebox-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
publish = false

[lib]
name = "moviebox_bridge"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
moviebox-tui = { path = "../core" }
jni = { version = "0.21.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
futures = "0.3.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
